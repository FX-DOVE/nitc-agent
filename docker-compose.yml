# Nitc Agent Phase 2 — chat agent + interactive desktop (noVNC)
services:
  agent:
    build: .
    container_name: nitc-agent
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/app/workspace
      - HOST=0.0.0.0
      - PORT=8080
      - DESKTOP_API_URL=http://desktop:7090
      - NOVNC_UPSTREAM=http://desktop:6080
      - NOVNC_PUBLIC_URL=${NOVNC_PUBLIC_URL:-http://localhost:6080}
    volumes:
      - ./workspace:/app/workspace
      - ./screenshots:/app/screenshots
    depends_on:
      desktop:
        condition: service_healthy
    networks:
      - nitc
    restart: unless-stopped
    shm_size: "256mb"

  desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    container_name: nitc-desktop
    ports:
      # Direct noVNC (optional; prefer same-origin /novnc/ via agent :8080)
      - "6080:6080"
      # desktop-api stays internal (7090) — not published
    environment:
      - DISPLAY=:99
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - VNC_NO_PASSWORD=${VNC_NO_PASSWORD:-1}
      - DESKTOP_WORKSPACE=/home/desktop/workspace
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1280}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-800}
    volumes:
      # Shared sandbox with the agent
      - ./workspace:/home/desktop/workspace
    networks:
      - nitc
    restart: unless-stopped
    shm_size: "256mb"
    # XFCE image is heavier; 4GB VPS: keep shm modest, avoid mem_limit wars with agent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  nitc:
    driver: bridge
