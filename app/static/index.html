<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Animal Nitc</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-pill: rgba(44, 44, 46, 0.92);
      --border: #2c2c2e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --muted: #6e6e73;
      --green: #34c759;
      --green-soft: #3ddc84;
      --teardrop: #34c759;
      --danger: #ff453a;
      --ok: #34c759;
      --radius-bubble: 22px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --btn-size: 40px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    img, iframe, video { max-width: 100%; }
    img { display: block; height: auto; }
    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      position: fixed;
      inset: 0;
    }
    button, textarea { font: inherit; color: inherit; }
    a { color: var(--green-soft); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overflow-x: hidden;
      background: var(--bg);
      position: relative;
    }

    /* —— Green teardrop logo —— */
    .teardrop {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }
    .teardrop.lg { width: 28px; height: 28px; }
    .teardrop.sm { width: 18px; height: 18px; }

    /* —— Circular icon button —— */
    .icon-btn {
      width: var(--btn-size);
      height: var(--btn-size);
      border-radius: 50%;
      border: none;
      background: var(--surface-pill);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      padding: 0;
      transition: background .15s, transform .1s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .icon-btn.white {
      background: #fff;
      color: #000;
    }
    .icon-btn.white:hover { background: #e8e8ed; }
    .icon-btn svg { display: block; }

    /* —— Views —— */
    .view {
      display: none;
      flex: 1;
      min-height: 0;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
    }
    .view.active { display: flex; }

    /* —— Chat top bar —— */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      padding: 10px 14px;
      padding-top: max(10px, var(--safe-top));
      background: var(--bg);
      z-index: 5;
    }
    .topbar-center {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: var(--btn-size);
      padding: 0 16px 0 12px;
      border-radius: 999px;
      background: var(--surface-pill);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      max-width: min(220px, 55vw);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-spacer { width: var(--btn-size); flex-shrink: 0; }
    .topbar-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .topbar-title-row .name {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* —— Messages —— */
    #messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 8px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      width: 100%;
      max-width: 100%;
    }
    .msg-row {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 100%;
      margin: 0;
      animation: fadeIn .2s ease;
      min-width: 0;
      align-items: flex-end;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    .msg-row .avatar { display: none; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius-bubble);
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: min(88%, 520px);
      min-width: 0;
      background: var(--surface);
      color: var(--text);
    }
    .msg-row.user .bubble {
      background: var(--surface-2);
      border-radius: 22px 22px 6px 22px;
      white-space: pre-wrap;
    }
    .msg-row.assistant .bubble {
      background: var(--surface);
      border-radius: 22px 22px 22px 6px;
    }
    .msg-row.system {
      justify-content: center;
    }
    .msg-row.system .bubble {
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      max-width: 90%;
      padding: 6px 10px;
      white-space: pre-wrap;
    }
    .ts-row {
      display: flex;
      justify-content: center;
      padding: 4px 0 2px;
    }
    .ts-row span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* Markdown inside assistant bubbles */
    .bubble.md-body { white-space: normal; }
    .bubble.md-body > *:first-child { margin-top: 0; }
    .bubble.md-body > *:last-child { margin-bottom: 0; }
    .bubble.md-body p { margin: 0 0 0.65em; }
    .bubble.md-body p:last-child { margin-bottom: 0; }
    .bubble.md-body ul, .bubble.md-body ol {
      margin: 0.35em 0 0.7em;
      padding-left: 1.25em;
    }
    .bubble.md-body li { margin: 0.2em 0; }
    .bubble.md-body li + li { margin-top: 0.35em; }
    .bubble.md-body strong { font-weight: 700; color: #fff; }
    .bubble.md-body h1, .bubble.md-body h2, .bubble.md-body h3,
    .bubble.md-body h4 {
      margin: 0.6em 0 0.35em;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }
    .bubble.md-body h1 { font-size: 1.15em; }
    .bubble.md-body h2 { font-size: 1.05em; }
    .bubble.md-body h3 { font-size: 1em; }
    .bubble.md-body code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: rgba(0,0,0,0.45);
      padding: 0.12em 0.4em;
      border-radius: 6px;
    }
    .bubble.md-body pre {
      background: #0a0a0a;
      border-radius: 14px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 0.5em 0 0.7em;
    }
    .bubble.md-body pre code {
      background: none; padding: 0; font-size: 0.82em;
    }
    .bubble.md-body a { color: var(--green-soft); }
    .bubble.md-body blockquote {
      margin: 0.5em 0;
      padding: 0.25em 0 0.25em 0.85em;
      border-left: 3px solid var(--surface-2);
      color: var(--text-secondary);
    }
    .bubble.md-body hr {
      border: none; border-top: 1px solid var(--border);
      margin: 0.75em 0;
    }

    .tools-badge {
      font-size: 0.72rem; color: var(--muted);
      margin-top: 8px; font-family: var(--mono);
    }
    .bubble-images {
      display: flex; flex-direction: column; gap: 8px;
      margin-top: 10px;
    }
    .bubble-images img {
      max-width: 100%; border-radius: 14px;
      border: 1px solid var(--border);
      background: #000;
    }

    /* Working status (Grok-style) */
    .working-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 2px 8px;
      color: var(--text-secondary);
      font-size: 0.92rem;
      animation: fadeIn .2s ease;
    }
    .working-row.hidden { display: none; }
    .working-row .label { font-weight: 400; }

    /* —— Composer —— */
    .composer-wrap {
      flex-shrink: 0;
      padding: 8px 12px max(12px, var(--safe-bottom));
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg);
    }
    .composer {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .composer-pill {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 44px;
      padding: 0 6px 0 16px;
      background: var(--surface-pill);
      border-radius: 999px;
      border: none;
    }
    .composer-pill:focus-within {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      height: 24px;
      background: transparent;
      color: var(--text);
      border: none;
      outline: none;
      padding: 0;
      line-height: 1.4;
      font-size: 16px; /* prevent iOS zoom */
    }
    #input::placeholder { color: var(--muted); }
    .pill-mic {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: default;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      padding: 0;
      opacity: 0.85;
    }
    #send.icon-btn.white svg { stroke: #000; }

    /* —— Computer view —— */
    .computer-view {
      background: var(--bg);
      padding: 0;
      gap: 0;
    }
    .computer-view .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: transparent;
      z-index: 10;
      pointer-events: none;
    }
    .computer-view .topbar > * { pointer-events: auto; }
    .desktop-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    #novnc-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      z-index: 1;
    }
    .desktop-empty {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text);
      text-align: center;
      padding: 24px;
      background: #000;
    }
    .desktop-empty.hidden { display: none; }
    .desktop-empty .connecting-label {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.85);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .computer-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px max(16px, var(--safe-bottom));
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    }
    .computer-bottom > * { pointer-events: auto; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      border: 0;
    }

    /* Hidden legacy sidebar hooks (kept for JS compatibility, not shown) */
    .sidebar, .backdrop, .sidebar-foot, .composer-hint, .desktop-meta {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <!-- Minimal hidden nav for JS compatibility -->
    <aside class="sidebar" id="sidebar" aria-hidden="true">
      <button type="button" class="nav-btn active" data-view="chat" id="nav-chat">Chat</button>
      <button type="button" class="nav-btn" data-view="computer" id="nav-computer">Computer</button>
      <button type="button" id="btn-new-chat">New</button>
      <div class="sidebar-foot">
        <span id="status-dot"></span>
        <span id="status-text">checking…</span>
      </div>
    </aside>

    <main class="main" style="display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;overflow:hidden;width:100%;">
      <!-- CHAT -->
      <section class="view active" id="view-chat">
        <header class="topbar">
          <button type="button" class="icon-btn" id="btn-back" aria-label="New chat" title="New chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <div class="topbar-center" title="Animal Nitc">
            <svg class="teardrop" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="tdg" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stop-color="#5ef08a"/>
                  <stop offset="100%" stop-color="#2bb84f"/>
                </linearGradient>
              </defs>
              <path fill="url(#tdg)" d="M32 4C22 18 12 30 12 42a20 20 0 0 0 40 0C52 30 42 18 32 4z"/>
              <circle cx="26" cy="28" r="3.2" fill="#0a0a0a"/>
              <circle cx="38" cy="28" r="3.2" fill="#0a0a0a"/>
            </svg>
            <span>Animal Nitc</span>
          </div>
          <button type="button" class="icon-btn" id="btn-open-computer" aria-label="Computer" title="Computer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="13" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </button>
        </header>

        <div id="messages">
          <div class="msg-row system">
            <div class="bubble">Welcome. Tap the monitor icon to watch the live desktop while I work.</div>
          </div>
        </div>

        <div class="working-row hidden" id="working-row" aria-live="polite">
          <svg class="teardrop sm" viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#34c759" d="M32 4C22 18 12 30 12 42a20 20 0 0 0 40 0C52 30 42 18 32 4z"/>
            <circle cx="26" cy="28" r="3.2" fill="#0a0a0a"/>
            <circle cx="38" cy="28" r="3.2" fill="#0a0a0a"/>
          </svg>
          <span class="label">Animal Nitc is working</span>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="form">
            <button type="button" class="icon-btn" id="btn-plus" aria-label="New chat" title="New chat">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <div class="composer-pill">
              <textarea id="input" placeholder="Ask Animal Nitc" rows="1" autofocus></textarea>
              <button type="button" class="pill-mic" aria-label="Voice" title="Voice (visual)" tabindex="-1">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="2" width="6" height="12" rx="3"/>
                  <path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>
                </svg>
              </button>
            </div>
            <button type="submit" class="icon-btn white" id="send" aria-label="Send">
              <!-- waveform icon (idle) / send when typing handled in JS optionally; use waveform to match Grok -->
              <svg id="send-icon-wave" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="2.5" y="9" width="2.4" height="6" rx="1.2"/>
                <rect x="7" y="5" width="2.4" height="14" rx="1.2"/>
                <rect x="11.5" y="7.5" width="2.4" height="9" rx="1.2"/>
                <rect x="16" y="4" width="2.4" height="16" rx="1.2"/>
                <rect x="20.5" y="9" width="2.4" height="6" rx="1.2"/>
              </svg>
            </button>
          </form>
        </div>
      </section>

      <!-- COMPUTER -->
      <section class="view computer-view" id="view-computer">
        <header class="topbar">
          <button type="button" class="icon-btn" id="btn-computer-back" aria-label="Back to chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <div class="topbar-title-row">
            <svg class="teardrop" viewBox="0 0 64 64" aria-hidden="true">
              <path fill="#34c759" d="M32 4C22 18 12 30 12 42a20 20 0 0 0 40 0C52 30 42 18 32 4z"/>
              <circle cx="26" cy="28" r="3.2" fill="#0a0a0a"/>
              <circle cx="38" cy="28" r="3.2" fill="#0a0a0a"/>
            </svg>
            <span class="name">Animal Nitc</span>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" id="novnc-help" aria-label="Help" title="Help">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.1 9a3 3 0 1 1 4.4 2.7c-.8.4-1.5 1-1.5 2M12 17h.01"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="novnc-reload" aria-label="More" title="Reload">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="6" cy="12" r="1.6"/>
                <circle cx="12" cy="12" r="1.6"/>
                <circle cx="18" cy="12" r="1.6"/>
              </svg>
            </button>
          </div>
        </header>

        <div class="desktop-stage">
          <div class="desktop-empty" id="desktop-empty">
            <div class="spinner" aria-hidden="true"></div>
            <p class="connecting-label">Connecting...</p>
            <button type="button" class="sr-only" id="novnc-connect">Connect</button>
            <button type="button" class="sr-only" id="novnc-connect-2">Connect desktop</button>
          </div>
          <iframe id="novnc-frame" title="Animal Nitc desktop noVNC" allow="clipboard-read; clipboard-write"></iframe>
        </div>

        <div class="computer-bottom">
          <button type="button" class="icon-btn" id="novnc-clipboard" aria-label="Clipboard" title="Open fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="3" width="8" height="4" rx="1"/>
              <path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
              <path d="M9 12h6M9 16h4"/>
            </svg>
          </button>
          <a class="icon-btn" id="novnc-open" href="#" target="_blank" rel="noopener" aria-label="Keyboard / fullscreen" title="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="12" rx="2"/>
              <circle cx="7" cy="13" r="0.9" fill="currentColor"/>
              <circle cx="10" cy="13" r="0.9" fill="currentColor"/>
              <circle cx="13" cy="13" r="0.9" fill="currentColor"/>
              <circle cx="16" cy="13" r="0.9" fill="currentColor"/>
              <circle cx="8.5" cy="10" r="0.9" fill="currentColor"/>
              <circle cx="11.5" cy="10" r="0.9" fill="currentColor"/>
              <circle cx="14.5" cy="10" r="0.9" fill="currentColor"/>
            </svg>
          </a>
        </div>
      </section>
    </main>
  </div>

  <!-- hidden menu toggles for JS compatibility -->
  <button type="button" class="sr-only" id="menu-toggle">Menu</button>
  <button type="button" class="sr-only" id="menu-toggle-2">Menu</button>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const novncFrame = document.getElementById("novnc-frame");
    const novncOpen = document.getElementById("novnc-open");
    const novncReload = document.getElementById("novnc-reload");
    const desktopEmpty = document.getElementById("desktop-empty");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const workingRow = document.getElementById("working-row");

    /** @type {{role: string, content: string}[]} */
    let history = [];
    let novncEmbed = "";
    let computerLoaded = false;

    if (window.marked) {
      marked.setOptions({
        gfm: true,
        breaks: true,
        headerIds: false,
        mangle: false,
      });
    }

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }
    input.addEventListener("input", autoResize);

    function stripMarkdownImages(text) {
      return String(text || "").replace(/!\[[^\]]*\]\((\/api\/media\/screenshots\/[^)]+)\)/g, "").trim();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderAssistantMarkdown(text) {
      const raw = String(text || "");
      if (window.marked && window.DOMPurify) {
        const html = marked.parse(raw);
        return DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true },
          ALLOWED_TAGS: [
            "p", "br", "strong", "em", "b", "i", "u", "s", "del",
            "ul", "ol", "li", "h1", "h2", "h3", "h4", "h5", "h6",
            "code", "pre", "blockquote", "a", "hr", "table", "thead",
            "tbody", "tr", "th", "td", "span"
          ],
          ALLOWED_ATTR: ["href", "title", "target", "rel", "class"],
          ALLOW_DATA_ATTR: false,
        });
      }
      let out = escapeHtml(raw);
      out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\n/g, "<br>");
      return out;
    }

    function formatNowTs() {
      try {
        const t = new Intl.DateTimeFormat(undefined, {
          hour: "numeric", minute: "2-digit"
        }).format(new Date());
        return "Today " + t;
      } catch (_) {
        return "Today";
      }
    }

    function appendTimestampIfNeeded() {
      const last = messagesEl.querySelector(".ts-row:last-of-type");
      // simple: show once per session start / after welcome
      if (!messagesEl.dataset.tsShown) {
        const row = document.createElement("div");
        row.className = "ts-row";
        row.innerHTML = "<span>" + escapeHtml(formatNowTs()) + "</span>";
        messagesEl.appendChild(row);
        messagesEl.dataset.tsShown = "1";
      }
    }

    function setWorking(on) {
      workingRow.classList.toggle("hidden", !on);
      if (on) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
        workingRow.scrollIntoView({ block: "nearest" });
      }
    }

    function appendMessage(role, content, extra, images) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      if (role !== "system") {
        const av = document.createElement("div");
        av.className = "avatar";
        av.textContent = role === "user" ? "You" : "N";
        row.appendChild(av);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (content === "__thinking__") {
        // Prefer Grok-style working row; keep a minimal bubble for removal handle
        bubble.style.display = "none";
        bubble.dataset.thinking = "1";
      } else if (role === "assistant") {
        bubble.classList.add("md-body");
        const display = Array.isArray(images) && images.length
          ? stripMarkdownImages(content)
          : content;
        bubble.innerHTML = renderAssistantMarkdown(display);
        if (Array.isArray(images) && images.length) {
          const wrap = document.createElement("div");
          wrap.className = "bubble-images";
          images.forEach((src) => {
            if (!src) return;
            const img = document.createElement("img");
            img.src = src;
            img.alt = "screenshot";
            img.loading = "lazy";
            wrap.appendChild(img);
          });
          bubble.appendChild(wrap);
        }
      } else if (role === "system") {
        bubble.innerHTML = content;
      } else {
        bubble.textContent = content;
      }
      if (extra) {
        const badge = document.createElement("div");
        badge.className = "tools-badge";
        badge.textContent = extra;
        bubble.appendChild(badge);
      }
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function setView(name) {
      document.querySelectorAll(".nav-btn[data-view]").forEach((b) => {
        b.classList.toggle("active", b.dataset.view === name);
      });
      document.querySelectorAll(".view").forEach((v) => {
        v.classList.toggle("active", v.id === "view-" + name);
      });
      closeSidebar();
      if (name === "computer") {
        // Always show connecting state briefly, then connect
        if (!computerLoaded) {
          desktopEmpty.classList.remove("hidden");
        }
        if (novncEmbed) {
          // slight delay so "Connecting..." is visible like the native app
          setTimeout(() => connectDesktop(), computerLoaded ? 0 : 400);
        }
      }
    }

    function connectDesktop() {
      if (!novncEmbed) return;
      novncFrame.src = novncEmbed;
      computerLoaded = true;
      // Keep spinner briefly, then hide when iframe loads
      const hide = () => desktopEmpty.classList.add("hidden");
      novncFrame.addEventListener("load", hide, { once: true });
      setTimeout(hide, 2500);
    }

    function newChat() {
      history = [];
      messagesEl.innerHTML = "";
      delete messagesEl.dataset.tsShown;
      appendMessage("system", "New chat started. Tap the monitor icon to watch the live desktop.");
      setWorking(false);
      setView("chat");
      input.focus();
    }

    function openSidebar() { /* no-op: Grok-style UI has no sidebar drawer */ }
    function closeSidebar() {
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    }

    document.querySelectorAll(".nav-btn[data-view]").forEach((b) => {
      b.addEventListener("click", () => setView(b.dataset.view));
    });
    document.getElementById("btn-new-chat").addEventListener("click", newChat);
    document.getElementById("btn-plus").addEventListener("click", newChat);
    document.getElementById("btn-back").addEventListener("click", newChat);
    document.getElementById("btn-open-computer").addEventListener("click", () => setView("computer"));
    document.getElementById("btn-computer-back").addEventListener("click", () => setView("chat"));
    document.getElementById("menu-toggle").addEventListener("click", openSidebar);
    document.getElementById("menu-toggle-2").addEventListener("click", openSidebar);
    backdrop.addEventListener("click", closeSidebar);
    document.getElementById("novnc-connect").addEventListener("click", connectDesktop);
    document.getElementById("novnc-connect-2").addEventListener("click", connectDesktop);
    document.getElementById("novnc-clipboard").addEventListener("click", () => {
      if (novncEmbed) window.open(novncEmbed, "_blank", "noopener");
    });
    document.getElementById("novnc-help").addEventListener("click", () => {
      alert("Animal Nitc Computer streams the live XFCE desktop via same-origin /novnc/ (path=websockify).");
    });
    novncReload.addEventListener("click", () => {
      if (novncEmbed) {
        desktopEmpty.classList.remove("hidden");
        novncFrame.src = novncEmbed;
        computerLoaded = true;
        const hide = () => desktopEmpty.classList.add("hidden");
        novncFrame.addEventListener("load", hide, { once: true });
        setTimeout(hide, 2500);
      }
    });

    async function loadConfig() {
      const fallback = "/novnc/vnc.html?autoconnect=1&resize=scale&path=websockify";
      try {
        const r = await fetch("/api/config");
        const data = await r.json();
        novncEmbed = data.novnc_embed_url || data.novnc_public_url || fallback;
        novncOpen.href = novncEmbed;
      } catch (e) {
        novncEmbed = fallback;
        novncOpen.href = novncEmbed;
      }
    }

    async function refreshHealth() {
      try {
        const r = await fetch("/health");
        const data = await r.json();
        statusDot.className = data.api_key_set ? "ok" : "err";
        statusText.textContent = data.api_key_set
          ? (data.model || "ready")
          : "missing API key";
      } catch (e) {
        statusDot.className = "err";
        statusText.textContent = "offline";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      autoResize();
      appendTimestampIfNeeded();
      appendMessage("user", text);
      history.push({ role: "user", content: text });
      sendBtn.disabled = true;
      setWorking(true);
      const thinking = appendMessage("assistant", "__thinking__");
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await r.json();
        thinking.remove();
        setWorking(false);
        if (!r.ok) {
          appendMessage("assistant", data.detail || JSON.stringify(data));
        } else {
          const extra = data.tool_rounds ? `tool rounds: ${data.tool_rounds}` : null;
          const images = Array.isArray(data.images) ? data.images : [];
          appendMessage("assistant", data.reply, extra, images);
          history.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        thinking.remove();
        setWorking(false);
        appendMessage("assistant", "Network error: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    loadConfig();
    refreshHealth();
    setInterval(refreshHealth, 30000);
  </script>
</body>
</html>
